name: Build Aurora Synth VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target AuroraSynth_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AuroraSynth-VST3
          path: build/AuroraSynth_artefacts/Release/VST3/
